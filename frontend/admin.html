<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | CleanVillage</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="admin-page"><header id="site-header"></header><main class="page">
  <div class="page-title admin-title"><div><p class="eyebrow">Protected management centre</p><h1>CleanVillage Admin Dashboard</h1><p>Review, verify and keep every complaint moving forward.</p></div><button id="logout-button" class="button secondary">Log out</button></div>
  <section class="stats dashboard-stats" id="stats"><article><span>▣</span><strong>—</strong><small>Total complaints</small></article><article><span>◷</span><strong>—</strong><small>Pending</small></article><article><span>◌</span><strong>—</strong><small>In progress</small></article><article><span>✓</span><strong>—</strong><small>Resolved</small></article></section>
  <section class="admin-panel"><div class="panel-head"><div><h2>Complaint management</h2><p id="admin-message" aria-live="polite"></p></div></div><div class="filters admin-filters"><input id="admin-search" placeholder="Search ID, citizen, location or category"><select id="admin-category-filter"><option value="">All categories</option><option>Garbage</option><option>Drainage</option><option>Sanitation</option><option>Dirty Water</option><option>Road Cleanliness</option><option>Other</option></select><select id="admin-status-filter"><option value="">All statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select><select id="admin-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="admin-list" class="admin-list"><div class="loading">Loading complaints…</div></div></section>
</main><div id="complaint-modal" class="modal" hidden></div><footer id="site-footer"></footer><script src="/static/script.js"></script></body></html>
