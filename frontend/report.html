<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Problem | CleanVillage</title><link rel="stylesheet" href="/static/style.css"></head><body><header id="site-header"></header><main class="page"><div class="page-title"><p class="eyebrow">Community care in action</p><h1>Report a cleanliness problem</h1><p>Share the details below. We’ll give you a Complaint ID to track the progress.</p></div><form class="form-card" id="complaint-form" novalidate><div class="form-grid"><label>Full name<input name="name" required placeholder="e.g. Rahul Naik"></label><label>Mobile number<input name="mobile" required inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label><label>Village / area<input name="area" required placeholder="e.g. Assagao"></label><label>Location<input name="location" required placeholder="e.g. Main Road, near temple"></label><label>Complaint category<select name="category" required><option value="">Select a category</option><option>Garbage</option><option>Drainage</option><option>Sanitation</option><option>Dirty Water</option><option>Road Cleanliness</option><option>Other</option></select></label><label>Photo <em>(optional, JPG/PNG, max 5 MB)</em><input name="photo" type="file" accept="image/jpeg,image/png"><span class="file-note">No file selected</span></label><label class="full">Describe the issue<textarea name="description" required rows="5" placeholder="Tell us what needs attention and how it affects the area."></textarea></label></div><p class="form-error" id="form-error"></p><button class="button" id="submit-button" type="submit">Submit complaint <span>→</span></button></form></main><div id="success-modal" class="modal" hidden><div class="modal-card"><span class="success-icon">✓</span><p class="eyebrow">Thank you for reporting</p><h2>Complaint submitted successfully!</h2><p>Please save this Complaint ID to check updates later.</p><div class="complaint-id"><strong id="new-id">VC1001</strong><button id="copy-id" aria-label="Copy complaint ID">⧉</button></div><div class="modal-actions"><a class="button" id="track-new" href="/track.html">Track complaint</a><button class="button secondary" id="report-another">Report another issue</button></div></div></div><footer id="site-footer"></footer><script src="/static/script.js"></script></body></html>
